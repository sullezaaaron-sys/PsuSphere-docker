
services:
  web:
    image: insidious13/psusphere:latest
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - django_data:/data
    environment:
      DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SQLITE_PATH: "/data/db.sqlite3"

volumes:
  django_data:
